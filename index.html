<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d47">
<title>يمن بزنس</title>
<link rel="manifest" href="manifest.json">
<meta property="og:title" content="يمن بزنس">
<meta property="og:description" content="الدخول إلى أنظمة يمن بزنس">
<meta property="og:image" content="https://yemenbusinessreports-lgtm.github.io/yemen-business/logo-320.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
html,body{margin:0;height:100%;background:#0f3d47;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f5f7}
#inst{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:2;padding:12px 22px;border:0;border-radius:999px;background:#c9a86a;color:#0f3d47;font:700 17px system-ui,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
#ask{position:fixed;inset:0;z-index:3;background:rgba(15,30,40,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#ask[hidden]{display:none}
#ask .b{background:#fff;border-radius:18px;padding:22px 18px;width:100%;max-width:360px;text-align:center;font:17px system-ui,sans-serif;color:#16232b;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#ask img{width:72px;height:72px;border-radius:16px}
#ask p{margin:12px 0 18px;line-height:1.6;font-weight:700}
#ask .k{display:flex;gap:8px}
#ask button{flex:1;padding:12px;border:0;border-radius:12px;font:700 17px system-ui,sans-serif;cursor:pointer}
#ask .y{background:#0f3d47;color:#fff}#ask .n{background:#eef2f5;color:#0f3d47}
#off{display:none;position:fixed;inset:0;align-items:center;justify-content:center;color:#fff;font:18px system-ui,sans-serif;text-align:center;padding:24px}
</style>
</head>
<body>
<!-- غلاف تطبيق «يمن بزنس»: يفتح بوابة الدخول الواحدة (/exec?app&w=1) داخل إطار بملء الشاشة. البوابة ترسل «جاهزة» ثم رابط الصفحة المختارة فيُفتح في الإطار نفسه؛ وإن لم تصل «جاهزة» يفتح /exec مباشرة -->
<iframe id="f" title="يمن بزنس" allow="clipboard-write"></iframe>
<button id="inst" type="button" hidden>📲 تثبيت يمن بزنس</button>
<div id="ask" hidden><div class="b" role="dialog"><img src="icon-192.png" alt=""><p>هل تريد تثبيت تطبيق «يمن بزنس» على جوالك؟</p><div class="k"><button type="button" class="y" id="askY">تثبيت</button><button type="button" class="n" id="askN">لاحقاً</button></div></div></div>
<div id="off">لا يوجد اتصال بالإنترنت — أعد المحاولة</div>
<script>
var EXEC = 'https://script.google.com/macros/s/AKfycbygciCe6rU_p7yfTFGyB1gPqRp211IblgRBiRfOncDjYhfmC7XXyeCTcKWkv-COfNom/exec';
var f = document.getElementById('f'), K = 'yemen_top', ok = false;
// رابط أول دخول من رسالة الواتساب: #n=الاسم&c=الرمز المؤقت (بعد # لا يصل لأي خادم) ⇒ يُمسح من الشريط فوراً ويُرسل للبوابة حين تجهز
var FILL = null; (function () { var h = new URLSearchParams(location.hash.slice(1)); if (h.get('n') && h.get('c')) { FILL = { yemen: 'fill', n: h.get('n'), c: h.get('c') }; history.replaceState(null, '', location.pathname + location.search); } })();
var top_ = function () { try { localStorage.setItem(K, '1'); } catch (e) {} location.replace(EXEC + '?app'); };
// الإطار أولاً؛ إن لم تُبلغ البوابة «جاهزة» خلال 15 ثانية (متصفح يمنع إطارات Google) ⇒ فتح /exec مباشرة، ويُتذكّر ذلك للمرات القادمة
var saidTop = false; try { saidTop = localStorage.getItem(K) === '1'; } catch (e) {}
if (saidTop) location.replace(EXEC + '?app');
else { f.src = EXEC + '?app&w=1'; setTimeout(function () { if (!ok && navigator.onLine) top_(); }, 15000); }
// رسالة البوابة { yemen:'go', url, ext }: صفحات النظام في الإطار؛ البرامج الأخرى في النافذة نفسها
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || !/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin)) return;
  if (d.yemen === 'ready') { ok = true; if (FILL && e.source) { e.source.postMessage(FILL, '*'); FILL = null; } return; }
  if (d.yemen !== 'go' || typeof d.url !== 'string') return;
  if (d.url.indexOf(EXEC + '?') === 0) f.src = d.url;
  else if (d.ext && /^https:\/\//.test(d.url)) location.href = d.url;
});
function net() { document.getElementById('off').style.display = navigator.onLine ? 'none' : 'flex'; }
addEventListener('online', function () { net(); f.src = f.src; }); addEventListener('offline', net); net();
// زر «تثبيت» بضغطة واحدة (Chrome أندرويد) — يختفي بعد التثبيت أو داخل التطبيق المثبّت
// أول فتح (قرار المالك 08-11): سؤال واضح قبل الدخول «هل تريد تثبيت…؟»؛ «لاحقاً» ⇒ يبقى الزر الصغير
var ip = null, inst = document.getElementById('inst'), ask = document.getElementById('ask');
var install = function () { ask.hidden = true; if (!ip) return; ip.prompt(); ip.userChoice.then(function () { ip = null; inst.hidden = true; }); };
addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault(); ip = e;
  var seen = false; try { seen = sessionStorage.getItem('yemen_ask') === '1'; sessionStorage.setItem('yemen_ask', '1'); } catch (x) {}
  if (seen) inst.hidden = false; else ask.hidden = false;
});
inst.onclick = install; document.getElementById('askY').onclick = install;
document.getElementById('askN').onclick = function () { ask.hidden = true; inst.hidden = false; };
addEventListener('appinstalled', function () { ask.hidden = true; inst.hidden = true; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
